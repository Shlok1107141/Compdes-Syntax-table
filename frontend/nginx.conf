server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API caps source at 64 KiB; JSON escaping can inflate the body, so
    # leave headroom and let the backend give the precise 413 message.
    client_max_body_size 512k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the backend trusts X-Real-IP for rate
        # limiting only because this proxy sets it from the real peer.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}
