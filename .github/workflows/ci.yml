name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:symbolize=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and compile C engine with sanitizers
        if: hashFiles('engine/*.c') != ''
        run: |
          cd engine
          echo "=== Compiling engine sources under -fsanitize=address,undefined -Wall -Wextra -Werror ==="
          for src in symtab_demo.c symtab_stress.c; do
            if [ -f "$src" ]; then
              bin="${src%.c}"
              echo "Compiling $src -> $bin"
              gcc -std=c11 "$src" -o "$bin" -fsanitize=address,undefined -Wall -Wextra -Werror -pedantic
            fi
          done

      - name: Run sanitizer-verified benchmarks and stress tests
        if: hashFiles('engine/*.c') != ''
        run: |
          cd engine
          if [ -f "./symtab_demo" ]; then
            echo "=== Executing symtab_demo ==="
            ./symtab_demo
          fi
          if [ -f "./symtab_stress" ]; then
            echo "=== Executing symtab_stress ==="
            ./symtab_stress
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        if: hashFiles('backend/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend pytest suite
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          pytest -v --tb=short

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm ci

      - name: Lint and type-check
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          if npm run | grep -q "lint"; then
            npm run lint
          fi

      - name: Build production bundle
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm run build
