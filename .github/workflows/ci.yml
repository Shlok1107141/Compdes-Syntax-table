name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: engine
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:symbolize=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and compile C engine with sanitizers
        if: hashFiles('engine/*.c') != ''
        run: |
          cd engine
          echo "=== Compiling engine sources under -fsanitize=address,undefined -Wall -Wextra -Werror ==="
          for src in symtab_demo.c symtab_stress.c; do
            if [ -f "$src" ]; then
              bin="${src%.c}"
              echo "Compiling $src -> $bin"
              gcc -std=c11 "$src" -o "$bin" -fsanitize=address,undefined -Wall -Wextra -Werror -pedantic
            fi
          done

      - name: Run sanitizer-verified benchmarks and stress tests
        if: hashFiles('engine/*.c') != ''
        run: |
          cd engine
          if [ -f "./symtab_demo" ]; then
            echo "=== Executing symtab_demo ==="
            ./symtab_demo
          fi
          if [ -f "./symtab_stress" ]; then
            echo "=== Executing symtab_stress ==="
            ./symtab_stress
          fi

      - name: Analyzer (links all variants) under sanitizers
        if: hashFiles('engine/symtab_analyze.c') != ''
        run: |
          cd engine
          make check

  firmware:
    name: firmware (Arduino Uno benchmark)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sketch's engine copy matches engine/
        run: python3 firmware/tools/sync_engine.py --check

      - name: Generated symbol sets and pools match the engine
        run: |
          python3 firmware/tools/gen_workloads.py
          git diff --exit-code firmware/uno_bench/src/workloads.h firmware/uno_bench/src/pools.h

      - name: Benchmark logic on the PC under sanitizers (all 8 structures)
        run: sh firmware/tools/host_test.sh

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Compile for the Uno (all 8 structures)
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.7
          for v in 0 1 2 3 4 5 6 7; do
            echo "=== BENCH_VARIANT=$v ==="
            arduino-cli compile --fqbn arduino:avr:uno \
              --build-property "compiler.c.extra_flags=-DBENCH_VARIANT=$v" \
              --build-property "compiler.cpp.extra_flags=-DBENCH_VARIANT=$v" \
              firmware/uno_bench | tail -2
          done

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        if: hashFiles('backend/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build syntax table engine
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -DSYNTAX_BENCH_CLI engine/syntax_table_compress.c -o engine/syntax_bench -lm

      - name: Run backend pytest suite
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          pytest -v --tb=short

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm ci

      - name: Lint and type-check
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          if npm run | grep -q "lint"; then
            npm run lint
          fi

      - name: Build production bundle
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build images
        if: hashFiles('docker-compose.yml') != ''
        run: docker compose build

      - name: Smoke-test the stack through nginx
        if: hashFiles('docker-compose.yml') != ''
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/api/health | grep -q '"engine_ready":true'
          curl -fsS -X POST http://localhost:8080/api/analyze \
               -H 'Content-Type: application/json' \
               -d '{"code":"int counter; int counter_max; void f(void) { int i; i = counter; }"}' \
            | tee /dev/stderr | grep -q '"compressed_bytes"'

      - name: Adversarial end-to-end suite against the containers
        if: hashFiles('backend/scripts/adversarial_e2e.py') != ''
        run: python3 backend/scripts/adversarial_e2e.py http://localhost:8080/api

      - name: Show logs on failure
        if: failure() && hashFiles('docker-compose.yml') != ''
        run: docker compose logs

      - name: Tear down
        if: always() && hashFiles('docker-compose.yml') != ''
        run: docker compose down
