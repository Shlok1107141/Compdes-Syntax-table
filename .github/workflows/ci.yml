name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with sanitizers
        if: hashFiles('engine/*.c') != ''
        run: |
          cd engine
          gcc symtab_demo.c -o symtab_demo -fsanitize=address,undefined -Wall -Wextra
          gcc symtab_stress.c -o symtab_stress -fsanitize=address,undefined -Wall -Wextra
      - name: Run
        if: hashFiles('engine/*.c') != ''
        run: |
          cd engine
          ./symtab_demo
          ./symtab_stress

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          python-version: '3.11'
      - name: Install deps
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          cd backend
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package.json') != ''
        with:
          node-version: '20'
      - name: Install and build
        if: hashFiles('frontend/package.json') != ''
        run: |
          cd frontend
          npm ci
          npm run build
